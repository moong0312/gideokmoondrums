<script>
(function () {
  try {
    var saved = localStorage.getItem("gm-theme");
    var theme = saved || (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
    document.documentElement.setAttribute("data-theme", theme);
  } catch (e) {}
})();
</script>

<!-- An original composition in the vocabulary of Kandinsky's Bauhaus-era
     geometric abstraction (circle, triangle, crossing lines, a filled
     square) — not a reproduction of any specific painting. Fixed behind
     every section, low-opacity so it reads as texture, not decoration. -->
<svg class="bg-lines" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <g fill="none" stroke="var(--ink-3)" stroke-width="1.4" opacity="0.16">
    <circle cx="1260" cy="190" r="240"/>
    <line x1="60" y1="30" x2="1540" y2="880"/>
    <line x1="30" y1="920" x2="1420" y2="40"/>
    <polygon points="190,800 460,800 300,570"/>
  </g>
  <g fill="var(--ink-3)" opacity="0.22">
    <circle cx="220" cy="140" r="4"/>
    <circle cx="980" cy="860" r="5"/>
    <circle cx="1500" cy="620" r="3"/>
  </g>
  <circle cx="1260" cy="190" r="4" fill="var(--accent)" opacity="0.45"/>
  <rect x="1060" y="560" width="86" height="86" fill="var(--ink)" opacity="0.05"/>
</svg>

<div class="player" id="player" hidden>
  <div class="player__bar">
    <button class="pbtn pbtn--main" id="pPlay" type="button" aria-label="Play">
      <span class="pico pico--play" aria-hidden="true"></span>

    <div class="player__seek">

    </div>

    <div class="player__nav">
      <button class="pbtn" id="pPrev" type="button" aria-label="Previous track"><span class="pico pico--prev" aria-hidden="true"></span></button>
      <button class="pbtn" id="pNext" type="button" aria-label="Next track"><span class="pico pico--next" aria-hidden="true"></span></button>
      <button class="pbtn pbtn--eye" id="pShow" type="button" aria-label="Show video" aria-pressed="false"><span class="pico pico--eye" aria-hidden="true"></span></button>
      <button class="pbtn" id="pClose" type="button" aria-label="Close player"><span class="pico pico--x" aria-hidden="true"></span></button>
    </div>
  </div>
  <div class="player__stage" id="pStage"><div id="pMount"></div></div>
</div>
