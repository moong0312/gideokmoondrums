<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="EDGE">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#17110b"/>
      <stop offset="100%" stop-color="#0b0908"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8813f" stop-opacity=".28"/>
      <stop offset="100%" stop-color="#e8813f" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#e8813f" stroke-opacity=".08" stroke-width="1"/>
    </pattern>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000" fill-opacity=".18"/>
    </pattern>
    <clipPath id="frame"><rect x="0" y="0" width="800" height="600"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="800" height="600" fill="url(#bg)"/>
    <rect width="800" height="600" fill="url(#grid)"/>

    <!-- horizon glow -->
    <rect x="0" y="330" width="800" height="270" fill="url(#glow)"/>
    <line x1="0" y1="452" x2="800" y2="452" stroke="#e8813f" stroke-opacity=".5" stroke-width="1.5"/>

    <!-- perspective lines -->
    <g stroke="#e8813f" stroke-opacity=".14" stroke-width="1">
      <line x1="400" y1="452" x2="40" y2="600"/>
      <line x1="400" y1="452" x2="180" y2="600"/>
      <line x1="400" y1="452" x2="320" y2="600"/>
      <line x1="400" y1="452" x2="480" y2="600"/>
      <line x1="400" y1="452" x2="620" y2="600"/>
      <line x1="400" y1="452" x2="760" y2="600"/>
    </g>

    <!-- corner HUD brackets -->
    <g stroke="#e8813f" stroke-width="2" fill="none" stroke-opacity=".65">
      <path d="M36 40 H84 M36 40 V88"/>
      <path d="M764 40 H716 M764 40 V88"/>
      <path d="M36 560 H84 M36 560 V512"/>
      <path d="M764 560 H716 M764 560 V512"/>
    </g>

    <!-- glitch-offset EDGE (cyan + magenta split) -->
    <text x="400" y="300" text-anchor="middle"
          font-family="'Arial Black', Impact, 'Haettenschweiler', sans-serif"
          font-weight="900" font-size="176" letter-spacing="4"
          fill="#3fd7e8" fill-opacity=".55" transform="translate(-6,-4)">EDGE</text>
    <text x="400" y="300" text-anchor="middle"
          font-family="'Arial Black', Impact, 'Haettenschweiler', sans-serif"
          font-weight="900" font-size="176" letter-spacing="4"
          fill="#e83f8a" fill-opacity=".45" transform="translate(6,4)">EDGE</text>
    <text x="400" y="300" text-anchor="middle"
          font-family="'Arial Black', Impact, 'Haettenschweiler', sans-serif"
          font-weight="900" font-size="176" letter-spacing="4"
          fill="#f7ede0">EDGE</text>

    <!-- glitch slice tears -->
    <g fill="#0b0908">
      <rect x="0" y="238" width="800" height="6" opacity=".55"/>
      <rect x="0" y="272" width="800" height="3" opacity=".4"/>
      <rect x="0" y="318" width="800" height="4" opacity=".5"/>
    </g>
    <g fill="#3fd7e8" fill-opacity=".5">
      <rect x="120" y="238" width="220" height="6"/>
      <rect x="520" y="318" width="180" height="4"/>
    </g>

    <!-- subtitle -->
    <text x="400" y="368" text-anchor="middle"
          font-family="Inter, -apple-system, sans-serif"
          font-weight="500" font-size="20" letter-spacing="10"
          fill="#e8813f">QUARTET — BERN</text>

    <!-- scanlines + vignette -->
    <rect width="800" height="600" fill="url(#scan)"/>
    <rect width="800" height="600" fill="url(#bg)" opacity="0" />
  </g>
</svg>
