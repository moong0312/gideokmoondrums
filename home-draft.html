<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gideok Moon — front page draft</title>
<!-- A draft of the front page, kept beside the live one for comparison. Nothing
     links here and search engines are asked to stay out. Its styles and script
     are in this file on purpose: if the design is adopted they move into
     style.css and home.js; if not, deleting this one file removes all of it. -->
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f7f5ef">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">

<style>
/* ---- type -------------------------------------------------------------
   One family for everything but the masthead name: the system face, which on
   a Mac or iPhone is San Francisco, and on Windows and Android the platform's
   own equivalent. The site's three tokens — serif headings, mono labels, sans
   body — all point at it here, so the nav, the labels, the footer and the
   text read as one voice. Hangul falls to Apple SD Gothic Neo / Noto Sans KR.
   The name keeps Inter Tight: it is the one place type is the image. */
:root{
  --sys:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial,
        "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  --serif:var(--sys); --sans:var(--sys); --mono:var(--sys);
  --disp:"Inter Tight", -apple-system, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
}
.nav__id{ font-weight:600; font-size:14px; letter-spacing:.08em; }
.eyebrow{ font-style:normal; font-weight:600; font-size:10px; letter-spacing:.14em; }
.px__lead, .nx__w, .pl__n{ font-weight:500; }

/* ---- the poster ---------------------------------------------------------
   The front page as a poster rather than a profile card: the name set large
   enough to be the image, three photographs overlapping the way prints are
   pinned up in a rehearsal room, and under them the two things a visitor
   came for — when he plays next, and what he plays in. */
.px{ padding:34px 0 0; }

.px__name{
  margin:0; font-family:var(--disp); font-weight:600;
  font-size:clamp(54px, 15.5vw, 148px); line-height:.88; letter-spacing:-.055em;
  color:var(--ink);
}
.px__name em{ font-style:normal; font-weight:300; }   /* contrast by weight, not italics */
.px__name span{ display:block; }
.px__name span + span{ padding-left:.9em; }      /* the second word steps in */

.px__roles{
  margin:18px 0 0; display:flex; flex-wrap:wrap; gap:6px 14px; align-items:center;
  font-family:var(--mono); font-size:10.5px; letter-spacing:.16em; text-transform:uppercase; color:var(--ink-3);
}
.px__roles i{ width:5px; height:5px; background:var(--accent); display:inline-block; }

/* collage */
.px__stage{ position:relative; margin-top:26px; }
.px__pic{
  display:block; background:var(--paper-2) center / cover no-repeat;
  border:1px solid var(--line); box-shadow:0 14px 40px rgba(0,0,0,.14);
  transition:transform .6s var(--ease);
  will-change:transform;
}
.px__pic--a{ aspect-ratio:4/5; width:100%; background-position:center 22%; }
.px__pic--b{ aspect-ratio:3/1; width:74%; margin:-13% 0 0 26%; position:relative; z-index:2; }
.px__pic--c{ display:none; }

.px__say{ margin-top:30px; }
.px__say p{ margin:0; }
.px__lead{
  font-family:var(--sans); font-weight:400; font-size:clamp(19px, 2.4vw, 24px); letter-spacing:-.012em;
  line-height:1.36; letter-spacing:-.008em; color:var(--ink); text-wrap:balance;
}
.px__lead + p{ margin-top:14px; font-size:15px; line-height:1.62; color:var(--ink-2); max-width:44ch; }
.px__say .social{ margin-top:24px; }

/* next + projects */
.px__lower{ display:grid; gap:44px; margin-top:58px; padding:38px 0 62px; border-top:1px solid var(--line); }
.px__k{ margin:0 0 14px; }

.nx{ list-style:none; margin:0; padding:0; border-top:1px solid var(--line); }
.nx li{ border-bottom:1px solid var(--line); }
.nx a, .nx div{ display:grid; grid-template-columns:92px 1fr; gap:4px 18px; padding:13px 0; text-decoration:none; color:inherit; }
.nx__d{ font-family:var(--mono); font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); padding-top:4px; }
.nx__w{ font-family:var(--sans); font-weight:500; font-size:15.5px; line-height:1.3; letter-spacing:-.005em; }
.nx__v{ grid-column:2; font-size:12.5px; color:var(--ink-3); }
.px__all{ margin:16px 0 0; }

.pl{ list-style:none; margin:0; padding:0; border-top:1px solid var(--line); }
.pl li{ border-bottom:1px solid var(--line); }
.pl a{
  display:flex; align-items:baseline; justify-content:space-between; gap:16px;
  padding:14px 0 15px; text-decoration:none; color:var(--ink);
  transition:padding-left .35s var(--ease), color .25s var(--ease);
}
/* Two steps above the date titles beside them, not five: at 46px light the
   project names outweighed everything under the name and fought it. */
.pl__n{ font-family:var(--sans); font-weight:500; font-size:clamp(20px, 2.4vw, 23px); line-height:1.25; letter-spacing:-.01em; }
.pl__n small{ font-size:.6em; color:var(--ink-3); margin-left:.5em; letter-spacing:0; }
.pl__k{ font-family:var(--mono); font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-3); white-space:nowrap; }
.pl a:hover{ padding-left:12px; color:var(--accent); }

/* arrival — same curve and keyframes as the rest of the site */
.px__name span{ animation:gm-rise .9s var(--ease) both; }
.px__name span + span{ animation-delay:.1s; }
.px__roles{ animation:gm-in .9s var(--ease) both .3s; }
.px__pic{ animation:gm-in 1.1s var(--ease) both .2s; }
.px__pic--b{ animation-delay:.38s; }
.px__pic--c{ animation-delay:.5s; }
.px__say{ animation:gm-rise .8s var(--ease) both .5s; }

@media (min-width:860px){
  .px{ padding-top:44px; }
  .px__top{ display:grid; grid-template-columns:minmax(0,1.06fr) minmax(0,.94fr); gap:0 46px; align-items:start; }
  .px__head{ grid-column:1 / -1; display:flex; align-items:flex-end; justify-content:space-between; gap:24px; }
  .px__name{ font-size:clamp(96px, 10.6vw, 148px); }
  .px__name span + span{ padding-left:.34em; }    /* two lines on purpose: one line would need a smaller name */
  .px__roles{ margin:0 0 14px; justify-content:flex-end; text-align:right; max-width:210px; }
  .px__stage{ margin-top:30px; min-height:470px; }
  .px__pic--a{ aspect-ratio:auto; height:430px; width:68%; }
  .px__pic--b{ position:absolute; left:34%; top:292px; width:76%; margin:0; }
  .px__pic--c{ display:block; position:absolute; right:0; top:14px; width:54%; aspect-ratio:4/3; z-index:1; background-position:left top; }
  .px__say{ margin-top:74px; padding-left:20px; }
  .px__lower{ grid-template-columns:minmax(0,1fr) minmax(0,1.08fr); gap:56px; margin-top:74px; }
}
</style>
</head>
<body class="home" data-bg="sunset">

<a class="skip" href="#top">Skip to content</a>

<div class="shell">

<header class="nav" id="nav">
  <a class="nav__id" href="index.html">Gideok&nbsp;Moon</a>
  <div class="nav__right">
    <nav class="nav__links" aria-label="Pages">
      <a href="solo.html">Solo</a>
      <a href="iio.html">i!i!o</a>
      <a href="life-and-sound.html">Life and Sound</a>

      <a href="albums.html">Albums</a>
      <a href="performances.html">Performances</a>
      <a href="epk.html">Contact</a>
    </nav>
  </div>
</header>

<main id="top">
<section class="px">
  <div class="wrap">

    <div class="px__top">
      <div class="px__head">
        <h1 class="px__name"><span>Gideok</span> <span><em>Moon</em></span></h1>
        <p class="px__roles" id="pxRoles"></p>
      </div>

      <div class="px__stage" id="pxStage" aria-hidden="true">
        <span class="px__pic px__pic--a" data-depth="10"  style="background-image:url('assets/img/press/gideok-moon-03.jpg')"></span>
        <span class="px__pic px__pic--c" data-depth="-16" style="background-image:url('assets/img/home/pd-patch.png')"></span>
        <span class="px__pic px__pic--b" data-depth="22"  style="background-image:url('assets/img/head/solo.jpg')"></span>
      </div>

      <div class="px__say">
        <p class="px__lead" id="pxLead"></p>
        <p id="pxMore"></p>
        <ul class="social mono" id="social"></ul>
      </div>
    </div>

    <div class="px__lower">
      <div>
        <p class="eyebrow px__k" id="nxLabel">Next</p>
        <ul class="nx" id="nx"></ul>
        <p class="px__all"><a class="link" href="performances.html">All performances →</a></p>
      </div>
      <div>
        <p class="eyebrow px__k">Projects</p>
        <ul class="pl" id="pl"></ul>
      </div>
    </div>

  </div>
</section>
</main>

<footer class="foot">
  <div class="wrap foot__in mono">
    <div class="foot__cx" id="footContact"></div>
    <p><strong>Gideok Moon</strong> — Drummer &amp; Improviser · Bern &amp; Seoul</p>
    <p class="foot__c">© <span id="yr"></span> Gideok Moon</p>
  </div>
</footer>

</div><!-- /.shell -->

<script src="assets/js/data.js"></script>
<script src="assets/js/ui.js"></script>
<script>
(function () {
  "use strict";
  var GM = window.GM, S = GM.S, $ = GM.$, el = GM.el, esc = GM.esc;

  GM.boot(function () {
    var a = S.artist, intro = S.hero.intro || [];

    $("#pxRoles").innerHTML = a.roles.split("·").map(function (r) { return esc(r.trim()); })
      .concat(esc(a.base)).join(" <i></i> ");
    $("#pxLead").textContent = intro[0] || "";
    $("#pxMore").textContent = intro[1] || "";
    GM.social($("#social"));

    /* What is next. Dates still to come, soonest first; when the calendar is
       empty the heading says Recent and the latest three stand in, so the
       block never sits there with nothing in it. */
    var today = new Date().toISOString().slice(0, 10);
    var all = S.live.dates.slice().sort(function (x, y) { return x.date < y.date ? -1 : 1; });
    var next = all.filter(function (d) { return d.date >= today; }).slice(0, 4);
    if (!next.length) { next = all.slice(-3).reverse(); $("#nxLabel").textContent = "Recent"; }
    next.forEach(function (d) {
      var li = el("li"), row = el("div");
      row.appendChild(el("span", "nx__d", esc(d.label.replace(/, \d{4}$/, ""))));
      row.appendChild(el("span", "nx__w", esc(d.project)));
      row.appendChild(el("span", "nx__v", esc(d.venue)));
      li.appendChild(row); $("#nx").appendChild(li);
    });

    /* The projects as the page's own large type — the navigation again, but
       as something to read rather than a row of labels. One line per page, so
       the album that shares the Solo page does not get a second entry. */
    var seen = {};
    S.works.forEach(function (w) {
      if (seen[w.page]) return; seen[w.page] = 1;
      var li = el("li"), link = el("a");
      link.href = w.page;
      link.appendChild(el("span", "pl__n", esc(w.name) + (w.nameSub ? " <small>" + esc(w.nameSub) + "</small>" : "")));
      link.appendChild(el("span", "pl__k", esc(w.kind) + " →"));
      li.appendChild(link); $("#pl").appendChild(li);
    });

    /* The three prints drift at different depths under the pointer, so the
       stack reads as layered rather than flat. Mouse only, and not at all for
       anyone who asked for less motion. */
    var stage = $("#pxStage");
    if (stage && window.matchMedia &&
        matchMedia("(hover:hover) and (pointer:fine)").matches &&
        !matchMedia("(prefers-reduced-motion: reduce)").matches) {
      var pics = stage.querySelectorAll(".px__pic");
      var top = document.querySelector(".px__top");
      var move = function (x, y) {
        for (var i = 0; i < pics.length; i++) {
          var d = +pics[i].getAttribute("data-depth");
          pics[i].style.transform = "translate(" + (x * d).toFixed(1) + "px," + (y * d).toFixed(1) + "px)";
        }
      };
      top.addEventListener("pointermove", function (e) {
        var r = top.getBoundingClientRect();
        move((e.clientX - r.left) / r.width - 0.5, (e.clientY - r.top) / r.height - 0.5);
      });
      top.addEventListener("pointerleave", function () { move(0, 0); });
    }
  });
})();
</script>
</body>
